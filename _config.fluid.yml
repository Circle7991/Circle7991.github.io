# 导航与本地搜索。
navbar:
  blog_title: Circle
  menu:
    - { key: home, link: /, icon: 'iconfont icon-home-fill' }
    - { key: archive, link: /archives/, icon: 'iconfont icon-archive-fill' }
    - { key: category, link: /categories/, icon: 'iconfont icon-category-fill' }
    - { key: tag, link: /tags/, icon: 'iconfont icon-tags-fill' }
    - { key: about, link: /about/, icon: 'iconfont icon-user-fill' }
search:
  enable: true
  path: /local-search.xml
  generate_path: local-search.xml
  field: post
  content: true
# 使用 Fluid 自带头图，聚焦文章阅读。
index:
  banner_img: /img/default.png
  banner_img_height: 70
  banner_mask_alpha: 0.38
  slogan:
    enable: true
    text: 记录问题，理解原理，沉淀方法。
post:
  banner_img_height: 40
  banner_mask_alpha: 0.4
  meta:
    author:
      enable: true
    date:
      enable: true
      format: YYYY-MM-DD
  toc:
    enable: true
    placement: right
  copyright:
    enable: false
  comments:
    enable: false
archive:
  banner_img_height: 45
category:
  banner_img_height: 45
  collapse_depth: 1
tag:
  banner_img_height: 45
about:
  banner_img_height: 45
  avatar: https://github.com/Circle7991.png
  name: Circle
  intro: Unity 开发者 · 记录技术与思考
  icons:
    - { class: 'iconfont icon-github-fill', link: 'https://github.com/Circle7991', tip: GitHub }
# 支持读者手动切换浅色与深色。
dark_mode:
  enable: true
  default: light
fun_features:
  typing:
    enable: false
web_analytics:
  enable: false
footer:
  content: '<span>© Circle</span> · <a href="https://hexo.io" target="_blank" rel="noopener">Hexo</a> · <a href="https://github.com/fluid-dev/hexo-theme-fluid" target="_blank" rel="noopener">Fluid</a>'
